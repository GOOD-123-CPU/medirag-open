name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, test & coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test
        working-directory: backend
        run: mvn -B verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backend jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/medirag-backend.jar
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend (type check & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check & build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14
          if-no-files-found: ignore

  security-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks — scan commits & working tree for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend high-severity audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: GitHub dependency review (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Explain dependency-review boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "npm audit above is the executable high-severity gate."
          echo "GitHub dependency-review is advisory until the repository Dependency Graph is enabled."


  evaluation:
    name: Retrieval evaluation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run evaluation unit tests
        run: python -m unittest evaluation/test_eval_retrieval.py -v

      - name: Run explicit-label sanity benchmark
        run: |
          python evaluation/eval_retrieval.py \
            --kb evaluation/fixtures/sanity_kb.json \
            --cases evaluation/fixtures/sanity_cases.json \
            --top-k 1


  refresh-audit-lockfile:
    name: Refresh vulnerable npm lockfile
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/evaluation-contract'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply non-breaking npm audit fixes to lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already contains all non-breaking audit fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix: refresh vulnerable frontend lockfile"
          git push origin HEAD:${{ github.head_ref }}
