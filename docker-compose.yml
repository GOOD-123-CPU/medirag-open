name: medirag

# MediRAG 一键部署
# 使用方式：
#   1. cp .env.example .env  并填写 LLM_API_KEY 等配置
#   2. docker compose up -d
#   3. 访问 http://localhost （前端）  http://localhost:8080 （后端）

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: medirag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?please set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-medirag}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/medirag.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medirag-net

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: medirag-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medirag-net

  # ===== MinIO 对象存储 =====
  minio:
    image: minio/minio:latest
    container_name: medirag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?please set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?please set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - medirag-net

  # ===== Milvus 向量数据库（etcd + standalone） =====
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: medirag-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - medirag-net

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: medirag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - medirag-net

  # ===== Python 重排序微服务（可选，未配置时后端自动降级） =====
  reranker:
    build:
      context: ./reranker-service
      dockerfile: Dockerfile
    container_name: medirag-reranker
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
      RERANKER_MODEL: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
    networks:
      - medirag-net

  # ===== SpringBoot 后端 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medirag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medirag}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      JWT_SECRET: ${JWT_SECRET:?please set JWT_SECRET in .env}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:?please set LLM_API_KEY in .env}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-v3}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      EMBEDDING_ALLOW_PSEUDO_FALLBACK: ${EMBEDDING_ALLOW_PSEUDO_FALLBACK:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - medirag-net

  # ===== Nginx 前端 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medirag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medirag-net

volumes:
  mysql_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:

networks:
  medirag-net:
    driver: bridge
